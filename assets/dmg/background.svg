<?xml version="1.0" encoding="UTF-8"?>
<!-- mbl disk image background. 660x400 points. Finder draws mbl.app at (165,190) and the Applications alias at (495,190), 128pt icons, so the art only supplies the plate, the arrow and the hint. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F6F2"/>
      <stop offset="1" stop-color="#EEECE6"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.25" stop-color="#FF5E8A"/>
      <stop offset="0.5" stop-color="#C64BFF"/>
      <stop offset="0.75" stop-color="#6B5BFF"/>
      <stop offset="1" stop-color="#3FD6FF"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#plate)"/>

  <!-- Aurora rule flush with the bottom edge of the window. -->
  <rect x="0" y="396" width="660" height="4" fill="url(#aurora)"/>

  <!-- Arrow from the app to Applications. Finder icons are 128pt centred at x=165 and x=495. -->
  <path d="M258 190 C 300 190, 360 190, 402 190" fill="none" stroke="#1B1B25" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M388 176 L 404 190 L 388 204" fill="none" stroke="#1B1B25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Hint under the arrow. -->
  <text x="330" y="322" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" fill="#5E5C66">Drag mbl into Applications, then open it from there.</text>
</svg>
